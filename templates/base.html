{% load static %}
<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="نرسیمد آکادمی - پلتفرم جامع آموزش پزشکی برای دانشجویان، رزیدنت‌ها و متخصصان علوم پزشکی">
  <meta name="keywords" content="آموزش پزشکی, دوره پزشکی, قلب و عروق, مغز و اعصاب, داخلی, جراحی, نرسیمد">
  <title>{% block title %}نرسیمد آکادمی{% endblock %}</title>
  <link rel="icon" type="image/png" href="{% static 'assets/logonomy-1763455510995.png' %}">
  <link rel="shortcut icon" type="image/png" href="{% static 'assets/logonomy-1763455510995.png' %}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
  {% block extra_css %}{% endblock %}
</head>
<body data-authenticated="{{ request.user.is_authenticated|yesno:'true,false' }}">
  {% include 'includes/header.html' %}
  <main>{% block content %}{% endblock %}</main>
  {% include 'includes/footer.html' %}
  <div id="toast-container" class="toast-container" aria-live="polite"></div>
  <script src="{% static 'js/app.js' %}" defer></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
